# Local Postgres for development and UI tests. Reads credentials from .env (see .env.example).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insufind}
      POSTGRES_USER: ${POSTGRES_USER:-insufind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insufind}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
