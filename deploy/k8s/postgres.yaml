apiVersion: v1
kind: Secret
metadata:
  name: insufind-db
stringData:
  POSTGRES_DB: insufind
  POSTGRES_USER: insufind
  POSTGRES_PASSWORD: changeme   # local minikube only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef: { name: insufind-db }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "insufind"]
            periodSeconds: 5
          # emptyDir: demo data is reseeded by Flyway, so no PVC needed.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
