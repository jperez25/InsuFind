apiVersion: apps/v1
kind: Deployment
metadata:
  name: insufind-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: insufind-app }
  template:
    metadata:
      labels: { app: insufind-app }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command: ["sh", "-c", "until pg_isready -h postgres -U insufind; do sleep 2; done"]
      containers:
        - name: insufind-app
          image: insufind-app:latest
          imagePullPolicy: Never   # image is built inside minikube's docker
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/insufind
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: insufind-db, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: insufind-db, key: POSTGRES_PASSWORD } }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: insufind-app
spec:
  selector: { app: insufind-app }
  ports:
    - port: 8080
