apiVersion: apps/v1
kind: Deployment
metadata:
  name: insufind-ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: insufind-ui }
  template:
    metadata:
      labels: { app: insufind-ui }
    spec:
      containers:
        - name: insufind-ui
          image: insufind-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: insufind-ui
spec:
  type: NodePort
  selector: { app: insufind-ui }
  ports:
    - port: 80
